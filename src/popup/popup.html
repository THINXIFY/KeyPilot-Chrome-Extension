<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CipherKey</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="9" fill="url(#logo-gradient)" />
          <path d="M16 9a4 4 0 0 0-4 4v2h-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1v-2a4 4 0 0 0-4-4Zm0 2a2 2 0 0 1 2 2v2h-4v-2a2 2 0 0 1 2-2Z" fill="#FFFFFF" />
          <defs>
            <linearGradient id="logo-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0057FF" />
              <stop offset="1" stop-color="#0042C2" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="app__titles">
        <h1 class="app__title">CipherKey</h1>
        <p class="app__subtitle">Secure passwords, instantly.</p>
      </div>
    </header>

    <section class="card">
      <label class="visually-hidden" for="password-output">Generated password</label>
      <input
        id="password-output"
        class="password-output"
        type="text"
        readonly
        spellcheck="false"
        autocomplete="off"
        placeholder="No characters selected"
      />
    </section>

    <section class="strength" aria-live="polite">
      <div class="strength-meter__track">
        <div class="strength-meter__fill strength-meter__fill--weak"></div>
      </div>
      <div class="strength-meter__meta">
        <span class="strength-meter__label">Strength: Weak</span>
        <span class="strength-meter__count">16 characters</span>
      </div>
    </section>

    <section class="control">
      <div class="control__header">
        <label class="control__label" for="length-input">Length</label>
        <input
          id="length-input"
          class="length-input"
          type="number"
          min="8"
          max="64"
          step="1"
          value="16"
          inputmode="numeric"
        />
      </div>
      <input
        id="length-slider"
        class="length-slider"
        type="range"
        min="8"
        max="64"
        step="1"
        value="16"
      />
    </section>

    <section class="control control--types">
      <div class="toggle-grid">
        <label class="toggle">
          <input id="toggle-uppercase" type="checkbox" checked />
          <span class="toggle__switch" aria-hidden="true"></span>
          <span class="toggle__label">Uppercase (A-Z)</span>
        </label>
        <label class="toggle">
          <input id="toggle-lowercase" type="checkbox" checked />
          <span class="toggle__switch" aria-hidden="true"></span>
          <span class="toggle__label">Lowercase (a-z)</span>
        </label>
        <label class="toggle">
          <input id="toggle-numbers" type="checkbox" checked />
          <span class="toggle__switch" aria-hidden="true"></span>
          <span class="toggle__label">Numbers (0-9)</span>
        </label>
        <label class="toggle">
          <input id="toggle-symbols" type="checkbox" checked />
          <span class="toggle__switch" aria-hidden="true"></span>
          <span class="toggle__label">Symbols (!@#...)</span>
        </label>
      </div>
    </section>

    <div id="warning-banner" class="warning-banner" hidden>
      Select at least one character type to generate a password.
    </div>

    <div class="actions">
      <button id="generate-btn" class="btn btn--primary" type="button">
        Generate Password
      </button>
      <button id="copy-btn" class="btn btn--secondary" type="button">
        Copy
      </button>
    </div>

    <details class="advanced">
      <summary class="advanced__summary">Advanced options</summary>
      <div class="advanced__content">
        <label class="toggle toggle--full">
          <input id="toggle-exclude-similar" type="checkbox" />
          <span class="toggle__switch" aria-hidden="true"></span>
          <span class="toggle__label">Avoid similar characters (O, 0, I, l, 1)</span>
        </label>

        <div class="field">
          <label class="field__label" for="exclude-chars-input">Custom excluded characters</label>
          <input
            id="exclude-chars-input"
            class="field__input"
            type="text"
            placeholder="e.g. {}~^"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </details>

    <section class="smart-password">
      <h2 class="smart-password__title">Smart Password</h2>

      <div class="tabs" role="tablist">
        <button id="tab-name" class="tab tab--active" type="button" role="tab" aria-selected="true">From Name</button>
        <button id="tab-words" class="tab" type="button" role="tab" aria-selected="false">From Words</button>
      </div>

      <div id="panel-name" class="tab-panel" role="tabpanel">
        <label class="field__label" for="smart-name-input">Name, nickname, or initials</label>
        <input
          id="smart-name-input"
          class="field__input"
          type="text"
          placeholder="e.g. Sarah Johnson"
          autocomplete="off"
          spellcheck="false"
          maxlength="40"
        />
      </div>

      <div id="panel-words" class="tab-panel" role="tabpanel" hidden>
        <label class="field__label" for="smart-word-1">Words (up to 3)</label>
        <div class="word-inputs">
          <input id="smart-word-1" class="field__input" type="text" placeholder="Word 1" autocomplete="off" spellcheck="false" maxlength="20" />
          <input id="smart-word-2" class="field__input" type="text" placeholder="Word 2 (optional)" autocomplete="off" spellcheck="false" maxlength="20" />
          <input id="smart-word-3" class="field__input" type="text" placeholder="Word 3 (optional)" autocomplete="off" spellcheck="false" maxlength="20" />
        </div>
      </div>

      <button id="smart-generate-btn" class="btn btn--primary smart-password__generate" type="button" disabled>
        Generate Suggestions
      </button>

      <div id="smart-warning" class="warning-banner" hidden>
        Enter a name or at least one word to generate suggestions.
      </div>

      <div id="smart-results" class="smart-results"></div>
    </section>

    <div class="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
